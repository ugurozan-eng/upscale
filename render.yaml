services:
  - type: web
    name: upscale-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: starter
    branch: main
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: true
